[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesforce-mcp"
version = "0.2.0"
description = "Salesforce MCP server"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x removed mcp.server.fastmcp; stay on 1.x until the server is migrated.
    "mcp[cli]>=1.0.0,<2.0.0",
    "simple-salesforce>=1.12.0",
]

[project.scripts]
salesforce-mcp = "salesforce_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
